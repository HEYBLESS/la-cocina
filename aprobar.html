<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aprobar pedido · La Cocina</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<div class="wrap" style="max-width:640px;padding-top:50px">
  <div class="brand"><img src="img/logo.png" alt="HEY BLESS!" style="width:260px"></div>
  <div class="frame" style="padding:34px 30px;margin-top:30px;text-align:center">
    <div class="caps blk">Aprobar pedido</div>
    <p id="msg" style="font-size:17px;line-height:1.6;margin:18px 0 8px">Revisa en tu PayPal que llegó el pago y toca el botón.</p>
    <button class="btn" id="go" style="margin-top:14px">✅ Aprobar y enviar</button>
    <div class="spin" id="spin" style="display:none"></div>
  </div>
</div>
<script src="config.js?v=3"></script>
<script>
(function () {
  var token = decodeURIComponent(location.hash.slice(1));
  var msg = document.getElementById("msg"), go = document.getElementById("go"), spin = document.getElementById("spin");
  if (!token || !window.CONFIG || !CONFIG.backend) { msg.textContent = "Enlace inválido."; go.style.display = "none"; return; }
  go.onclick = function () {
    go.style.display = "none"; spin.style.display = "block"; msg.textContent = "Enviando archivos y licencia…";
    fetch(CONFIG.backend, { method: "POST", body: JSON.stringify({ action: "aprobar", token: token }) })
      .then(function (r) { return r.json(); })
      .then(function (r) { spin.style.display = "none"; msg.innerHTML = r.html || (r.ok ? "Listo." : "No se pudo aprobar."); })
      .catch(function () { spin.style.display = "none"; msg.textContent = "Error de conexión. Intenta de nuevo."; go.style.display = ""; });
  };
})();
</script>
</body>
</html>
